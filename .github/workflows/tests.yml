---
name: "CI"

concurrency:
  group: ${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

on: # yamllint disable-line rule:truthy
  pull_request:
    branches: [devel]
  workflow_dispatch:

jobs:
  changelog:
    uses: ansible/ansible-content-actions/.github/workflows/changelog.yaml@main
    if: github.event_name == 'pull_request'
  build-import:
    uses: ansible/ansible-content-actions/.github/workflows/build_import.yaml@main
  markdown-link-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: tcort/github-action-markdown-link-check@v1
        with:
          use-quiet-mode: 'yes'
          use-verbose-mode: 'yes'
          check-modified-files-only: 'yes'
          config-file: '.mlc_config.json'
          base-branch: ${{ github.base_ref || github.ref_name || 'devel' }}
  ansible-lint:
    uses: ansible/ansible-content-actions/.github/workflows/ansible_lint.yaml@main
  sanity:
    # Local workflow: certified hub env must live on real jobs (not on caller-only `uses:` jobs).
    uses: ./.github/workflows/tests_sanity.yml
    with:
      # AAP floor alignment: ansible-core 2.16 + Python 3.12 (see meta/runtime.yml)
      extra_matrix_entries: >-
        [{"description":"Sanity tests using ansible-core 2.16 and python 3.12","factors":["sanity","py3.12","2.16"],"name":"sanity-py3.12-2.16","python":"3.12"}]
    secrets:
      crc_publish_key: ${{ secrets.CRC_PUBLISH_KEY }}
  unit-galaxy:
    needs:
      - ansible-lint
    uses: ./.github/workflows/tests_unit.yml
    with:
      extra_matrix_entries: >-
        [{"description":"Unit tests using ansible-core 2.16 and python 3.12","factors":["unit","py3.12","2.16"],"name":"unit-py3.12-2.16","python":"3.12"}]
    secrets:
      crc_publish_key: ${{ secrets.CRC_PUBLISH_KEY }}
  all_green:
    if: ${{ always() }}
    needs:
      - changelog
      - build-import
      - sanity
      - unit-galaxy
      - ansible-lint
      - markdown-link-check
    runs-on: ubuntu-latest
    steps:
      - run: >-
          python -c "assert 'failure' not in
          set([
          '${{ needs.changelog.result }}',
          '${{ needs.build-import.result }}',
          '${{ needs.sanity.result }}',
          '${{ needs.unit-galaxy.result }}',
          '${{ needs.ansible-lint.result }}',
          '${{ needs.markdown-link-check.result }}'
          ])"
...
